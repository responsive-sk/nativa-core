; Nativa PHP Core — the one session directive the repository cannot set itself.
;
; Everything else about the session is already decided in tracked code:
; `config/session.php` sets `use_strict_mode`, `use_only_cookies`,
; `cookie_httponly`, `cookie_samesite`, `cookie_secure` (from HTTPS), the cookie
; name and the save path. Those are reviewable in a PR and are deliberately not
; duplicated here.
;
; `session.upload_progress.enabled` is different: it belongs to the ini layer,
; the application must not be able to override it (the exploit in
; CVE-2026-115560 *is* a runtime `ini_set()`), and PHP's default is `On`. Until
; the upstream fix ships — and afterwards, because nothing here draws an upload
; progress bar — this line is the mitigation.
;
; Install:
;
;   sudo cp deploy/php/99-nativa-session.ini /etc/php/conf.d/
;
; Verify on the SAPI that serves requests, never in a shell:
;
;   php-fpm -i | grep '^session.upload_progress.enabled'    # Off
;
; FPM pool equivalent, when the ini scan directory is not yours to change:
;
;   php_admin_flag[session.upload_progress.enabled] = off

session.upload_progress.enabled = 0
